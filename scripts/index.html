<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhiteboardIQ</title>
<style>
  /* ── Reset & tokens ─────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #22263a;
    --border:    #2e3250;
    --accent:    #7c6fff;
    --text:      #e8eaf6;
    --muted:     #7b82a8;
    --high:      #e05c5c;
    --medium:    #e0a84a;
    --low:       #4caf87;
    --radius:    12px;
    --font:      -apple-system, "SF Pro Text", system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Header ─────────────────────────────────── */
  .header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }

  .header-icon { font-size: 28px; flex-shrink: 0; line-height: 1; }

  .header-body { flex: 1; min-width: 0; }

  .meeting-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .summary {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .stats {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .stat-chip {
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
    color: var(--muted);
  }

  .stat-chip strong { color: var(--text); }

  /* ── Section headings ───────────────────────── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  /* ── Action item cards ──────────────────────── */
  .action-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
  }

  .action-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--priority-color, var(--border));
  }

  .action-card.high   { --priority-color: var(--high); }
  .action-card.medium { --priority-color: var(--medium); }
  .action-card.low    { --priority-color: var(--low); }

  .action-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .action-task {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
  }

  .priority-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .priority-badge.high   { background: rgba(224,92,92,0.15);  color: var(--high); }
  .priority-badge.medium { background: rgba(224,168,74,0.15); color: var(--medium); }
  .priority-badge.low    { background: rgba(76,175,135,0.15); color: var(--low); }

  .action-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
  }

  .meta-icon { font-size: 11px; }

  .action-notes {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-style: italic;
  }

  /* ── List items (decisions / questions) ──────── */
  .list-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 6px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .list-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  .list-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ── Empty state ────────────────────────────── */
  .empty {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    padding: 6px 0;
  }

  /* ── Footer ─────────────────────────────────── */
  .footer {
    text-align: center;
    font-size: 10px;
    color: var(--border);
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
// ── Helpers ───────────────────────────────────────────────

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function priorityEmoji(p) {
  return { High: '🔴', Medium: '🟡', Low: '🟢' }[p] ?? '⚪';
}

function renderCard(item) {
  const cls = (item.priority || 'low').toLowerCase();
  const notes = item.notes
    ? `<div class="action-notes">${esc(item.notes)}</div>` : '';
  return `
    <div class="action-card ${cls}">
      <div class="action-top">
        <div class="action-task">${esc(item.task)}</div>
        <span class="priority-badge ${cls}">
          ${priorityEmoji(item.priority)} ${esc(item.priority)}
        </span>
      </div>
      <div class="action-meta">
        <span class="meta-item">
          <span class="meta-icon">👤</span> ${esc(item.owner || 'Unassigned')}
        </span>
        <span class="meta-item">
          <span class="meta-icon">📅</span> ${esc(item.deadline || 'No deadline')}
        </span>
      </div>
      ${notes}
    </div>`;
}

function renderListItem(icon, text) {
  return `
    <div class="list-card">
      <span class="list-icon">${icon}</span>
      <span class="list-text">${esc(text)}</span>
    </div>`;
}

function render(data) {
  const actions   = data.action_items  || [];
  const decisions = data.decisions     || [];
  const questions = data.questions     || [];

  const actionHTML = actions.length
    ? actions.map(renderCard).join('')
    : '<p class="empty">No action items found.</p>';

  const decisionHTML = decisions.length
    ? decisions.map(d => renderListItem('🏛️', d)).join('')
    : '<p class="empty">None noted.</p>';

  const questionHTML = questions.length
    ? questions.map(q => renderListItem('❓', q)).join('')
    : '<p class="empty">None noted.</p>';

  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="header-icon">🗒️</div>
      <div class="header-body">
        <div class="meeting-title">${esc(data.meeting_context || 'Whiteboard Summary')}</div>
        <div class="summary">${esc(data.summary || '')}</div>
        <div class="stats">
          <span class="stat-chip"><strong>${actions.length}</strong> action items</span>
          <span class="stat-chip"><strong>${decisions.length}</strong> decisions</span>
          <span class="stat-chip"><strong>${questions.length}</strong> questions</span>
        </div>
      </div>
    </div>

    <div class="section-title">✅ Action Items</div>
    ${actionHTML}

    <div class="section-title">🏛️ Decisions</div>
    ${decisionHTML}

    <div class="section-title">❓ Open Questions</div>
    ${questionHTML}

    <div class="footer">WhiteboardIQ · Gemma 4 · Google AI Edge Gallery</div>
  `;
}

// ── Entry point ───────────────────────────────────────────
// Called by the Gallery app with (data: string, secret: string)
window['ai_edge_gallery_get_result'] = async (data, secret) => {
  try {
    const parsed = JSON.parse(data);
    render(parsed);

    // Return webview pointing to this same file (already rendered in-page)
    return JSON.stringify({
      webview: {
        url: 'index.html',
        aspectRatio: 1.6
      }
    });
  } catch (e) {
    return JSON.stringify({ error: 'WhiteboardIQ: ' + e.message });
  }
};
</script>
</body>
</html>

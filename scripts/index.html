<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<script>
// Entry point called by Edge Gallery with the JSON data from Gemma.
// Passes data to the hosted webview via URL query param.
window['ai_edge_gallery_get_result'] = async (data, secret) => {
  try {
    // Validate the JSON is parseable before sending
    JSON.parse(data);

    const baseUrl = 'https://samirzubair.github.io/GEMMA4/assets/webview-v2.html';
    const url = baseUrl + '?data=' + encodeURIComponent(data);

    return JSON.stringify({
      webview: {
        url: url,
        aspectRatio: 1.5
      }
    });
  } catch (e) {
    return JSON.stringify({ error: 'WhiteboardIQ error: ' + e.message });
  }
};
</script>
</body>
</html>
